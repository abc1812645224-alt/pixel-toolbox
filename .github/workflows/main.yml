name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create signing keystore
      run: |
        keytool -genkeypair -v -keystore release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass pixeltoolbox -keypass pixeltoolbox -dname "CN=PixelToolbox, OU=Dev, O=PixelToolbox, L=City, S=State, C=CN"
        echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=pixeltoolbox" >> $GITHUB_ENV
        echo "KEY_ALIAS=key0" >> $GITHUB_ENV
        echo "KEY_PASSWORD=pixeltoolbox" >> $GITHUB_ENV

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2
        arguments: assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
