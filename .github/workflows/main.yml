name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create signing keystore
      run: |
        keytool -genkeypair -v -keystore release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass pixeltoolbox -keypass pixeltoolbox -dname "CN=PixelToolbox, OU=Dev, O=PixelToolbox, L=City, S=State, C=CN"
        echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=pixeltoolbox" >> $GITHUB_ENV
        echo "KEY_ALIAS=key0" >> $GITHUB_ENV
        echo "KEY_PASSWORD=pixeltoolbox" >> $GITHUB_ENV

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 像素工具箱-Shizuku版-v1.1.6
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.6
        name: 像素工具箱 (Shizuku版) v1.1.6
        body: |
          ## 像素工具箱 (Shizuku版) v1.1.6
          - 区分 Shizuku 版本应用名称与系统标识 (`像素工具箱 (Shizuku版)`)
          - 统一推送服务无感静默托管（自动授予通知栏权限、隐藏桌面图标）
          - 重构统一推送服务控制台 UI 风格
          - 补充关于页面开源致谢 (Trumeet / MiPushFramework)
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
